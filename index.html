<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OPD Card Allocation Calculator</title>
<style>
:root{--green:#15803d;--dark:#14532d;--soft:#dcfce7;--blue:#1d4ed8;--blueSoft:#eff6ff;--border:#d1d5db;--text:#111827;--muted:#6b7280;--page:#f3f4f6;--white:#fff;--danger:#991b1b;--dangerBg:#fee2e2;--warn:#92400e;--warnBg:#fef3c7;--ok:#166534;--okBg:#dcfce7}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--page);color:var(--text)}.app{width:min(100%,1000px);margin:auto;padding:16px 12px 30px}header{background:linear-gradient(135deg,var(--dark),var(--green));color:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(20,83,45,.18)}h1{font-size:clamp(1.4rem,4vw,2rem);margin:0 0 4px}header p{margin:0;opacity:.9}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.04)}h2{font-size:1.1rem;color:var(--dark);margin:0 0 14px}.input-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.input-group{border:1px solid #e5e7eb;border-radius:12px;padding:13px}.input-group h3{margin:0 0 10px;font-size:.98rem;color:var(--dark)}.field{display:grid;grid-template-columns:1fr 105px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eef0f2}.field:last-child{border-bottom:0}.field label{font-weight:650;font-size:.91rem}.field small{display:block;color:var(--muted);font-weight:400;margin-top:2px}input[type=number]{width:100%;min-height:44px;border:1.5px solid #93c5fd;border-radius:10px;padding:8px;font-size:1rem;font-weight:750;color:var(--blue);background:var(--blueSoft);text-align:center;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.12)}.status{border-radius:10px;padding:11px 13px;font-weight:750;margin-bottom:12px}.person-summary{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}.person-summary-item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px}.person-summary-item span:first-child{font-weight:700;color:#374151}.person-summary-item strong{font-size:1.08rem;color:var(--dark);white-space:nowrap}.ok{color:var(--ok);background:var(--okBg)}.warning{color:var(--warn);background:var(--warnBg)}.error{color:var(--danger);background:var(--dangerBg)}.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:11px}table{width:100%;border-collapse:collapse;min-width:0}th,td{padding:10px 11px;border-bottom:1px solid #e5e7eb;vertical-align:top}th{background:var(--dark);color:#fff;text-align:left;font-size:.88rem}td:nth-child(2),td:nth-child(3),td:nth-child(4),th:nth-child(2),th:nth-child(3),th:nth-child(4){text-align:center}tbody tr:last-child td{border-bottom:0}.per-person{font-weight:800}.total{background:#f0fdf4;font-weight:800}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}button{border:0;border-radius:10px;padding:11px 15px;min-height:44px;font-weight:750;font-size:.94rem;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#e5e7eb;color:#111827}.rule{background:#f9fafb;border-left:4px solid var(--green);padding:10px 12px;border-radius:6px;color:#374151;font-size:.9rem}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(30px);background:#111827;color:#fff;padding:10px 14px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:760px){
.input-columns{grid-template-columns:1fr;gap:12px}.app{padding:8px 8px 22px}header{border-radius:12px;padding:16px 14px;margin-bottom:10px}.card{padding:12px;margin-bottom:10px;border-radius:12px}.input-group{padding:11px}.field{grid-template-columns:minmax(0,1fr) 96px;gap:8px;padding:8px 0}.field label{font-size:.9rem}input[type=number]{min-height:46px;font-size:1.05rem}.actions{display:grid;grid-template-columns:1fr;gap:8px}.actions button{width:100%;min-height:48px}.table-wrap{overflow:visible;border:0}.table-wrap table,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block;width:100%}.table-wrap thead{display:none}.table-wrap tbody{display:grid;gap:10px}.table-wrap tr{border:1px solid var(--border);border-radius:11px;background:#fff;overflow:hidden}.table-wrap td{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,42%);gap:10px;padding:9px 11px;border-bottom:1px solid #e5e7eb;text-align:right!important;align-items:start}.table-wrap td:last-child{border-bottom:0}.table-wrap td::before{content:attr(data-label);font-weight:700;color:#374151;text-align:left}.table-wrap td:first-child{display:block;text-align:left!important;background:#f9fafb;font-weight:800;color:var(--dark)}.table-wrap td:first-child::before{content:none}.table-wrap tr.total{background:#f0fdf4}.table-wrap tr.total td:first-child{background:#dcfce7}.per-person{font-size:1.08rem}.status{font-size:.92rem}.person-summary{grid-template-columns:1fr}.person-summary-item{padding:10px 11px}.rule{font-size:.85rem}}
@media(max-width:420px){.field{grid-template-columns:1fr}.field input{margin-top:2px}.app{padding-left:6px;padding-right:6px}h1{font-size:1.35rem}header p{font-size:.9rem}.table-wrap td{grid-template-columns:minmax(0,1fr) minmax(78px,46%)}}@media print{body{background:#fff}.inputs-card,.actions,.rule{display:none}.card,header{box-shadow:none}}
</style>
</head>
<body>
<main class="app">
<header><h1>OPD Card Allocation Calculator</h1><p>Enter today’s cards and available staff. Allocation updates automatically.</p></header>
<section class="card inputs-card"><h2>Inputs</h2><div class="input-columns">
<div class="input-group"><h3>Today’s workload and staff</h3>
<div class="field"><label for="newCards">New cards</label><input id="newCards" type="number" min="0" step="1" placeholder="Enter"></div>
<div class="field"><label for="oldCards">Old cards<small>Including LCC files</small></label><input id="oldCards" type="number" min="0" step="1" placeholder="Enter"></div>
<div class="field"><label for="totalJR">Total JRs</label><input id="totalJR" type="number" min="0" step="1" placeholder="Enter"></div>
<div class="field"><label for="totalSR">Total SRs</label><input id="totalSR" type="number" min="0" step="1" placeholder="Enter"></div>
<div class="field"><label for="totalConsultants">Total consultants</label><input id="totalConsultants" type="number" min="0" step="1" placeholder="Enter"></div>
</div>
<div class="input-group"><h3>Reduced-load and allocation settings</h3>
<div class="field"><label for="reducedJR">Reduced-load JRs</label><input id="reducedJR" type="number" min="0" step="1" value="0"></div>
<div class="field"><label for="reducedSR">Reduced-load SRs<small>Include ward SRs</small></label><input id="reducedSR" type="number" min="0" step="1" value="2"></div>
<div class="field"><label for="reducedConsultants">Reduced-load consultants</label><input id="reducedConsultants" type="number" min="0" step="1" value="0"></div>
<div class="field"><label for="reduction">Reduction per reduced-load person</label><input id="reduction" type="number" min="0" step="1" value="10"></div>
<div class="field"><label for="maxJR">Maximum cards per JR</label><input id="maxJR" type="number" min="0" step="1" value="25"></div>
<div class="field"><label for="gap">Regular staff should receive at least ____ more cards than JRs</label><input id="gap" type="number" min="0" step="1" value="5"></div>
</div></div></section>
<section class="card"><h2>Allocation output</h2><div id="personSummary" class="person-summary"></div><div id="status" class="status" style="display:none"></div><div class="actions"><button class="primary" id="share">Share summary</button><button class="secondary" id="copy">Copy summary</button><button class="secondary" id="reset">Reset</button></div></section>
</main><div id="toast"></div>
<script>
(()=>{const leftIds=['newCards','oldCards','totalJR','totalSR','totalConsultants'];const allIds=[...leftIds,'reducedJR','reducedSR','reducedConsultants','reduction','maxJR','gap'];const $=id=>document.getElementById(id);const int=n=>Number.isInteger(n)&&n>=0&&Number.isFinite(n);function read(){let x={};for(const id of allIds){const raw=$(id).value.trim();x[id]=raw===''?null:Number(raw)}return x}function seniorRegular(x,c){const total=x.newCards+x.oldCards,regJR=Math.max(0,x.totalJR-x.reducedJR),jrTotal=regJR*c+x.reducedJR*Math.max(0,c-x.reduction),remaining=Math.max(0,total-jrTotal),regularSenior=Math.max(0,x.totalSR-x.reducedSR)+Math.max(0,x.totalConsultants-x.reducedConsultants),reducedSenior=x.reducedSR+x.reducedConsultants,allSenior=x.totalSR+x.totalConsultants;if(regularSenior===0)return allSenior===0?0:remaining/allSenior;if(remaining/regularSenior<x.reduction)return remaining/regularSenior;return(remaining+reducedSenior*x.reduction)/allSenior}function distribute(groups,total){const rows=groups.map((g,i)=>{const theoretical=g.people*g.per;const floor=Math.floor(theoretical);return{...g,theoretical,floor,frac:theoretical-floor,i}});let left=total-rows.reduce((s,r)=>s+r.floor,0);rows.sort((a,b)=>b.frac-a.frac||a.i-b.i);for(let i=0;i<left;i++)if(rows[i])rows[i].floor++;rows.sort((a,b)=>a.i-b.i);return rows.map(r=>({...r,total:r.floor,base:r.people?Math.floor(r.floor/r.people):0,plus:r.people?r.floor%r.people:0}))}function calc(x){const total=x.newCards+x.oldCards,regJR=Math.max(0,x.totalJR-x.reducedJR),regSR=Math.max(0,x.totalSR-x.reducedSR),regC=Math.max(0,x.totalConsultants-x.reducedConsultants);let selected=0;if(x.totalJR>0){for(let c=0;c<=x.maxJR;c++){const jrTotal=regJR*c+x.reducedJR*Math.max(0,c-x.reduction);if(jrTotal<=total&&Math.floor(seniorRegular(x,c))>=c+x.gap)selected=c}}const redJRPer=Math.max(0,selected-x.reduction),jrTotal=regJR*selected+x.reducedJR*redJRPer,remaining=total-jrTotal,regSeniorPer=seniorRegular(x,selected),redSeniorPer=Math.max(0,regSeniorPer-x.reduction);const groups=[{name:'Reduced-load JRs',people:x.reducedJR,per:redJRPer},{name:'Regular-load JRs',people:regJR,per:selected},{name:'Reduced-load SRs',people:x.reducedSR,per:redSeniorPer},{name:'Regular-load SRs',people:regSR,per:regSeniorPer},{name:'Reduced-load consultants',people:x.reducedConsultants,per:redSeniorPer},{name:'Regular-load consultants',people:regC,per:regSeniorPer}];return{total,rows:distribute(groups,total),selected}}function validate(x){if(leftIds.some(id=>x[id]===null))return['empty',''];if(allIds.some(id=>!int(x[id])))return['error','Enter non-negative whole numbers in all fields.'];if(x.reducedJR>x.totalJR)return['error','Reduced-load JRs cannot exceed total JRs.'];if(x.reducedSR>x.totalSR)return['error','Reduced-load SRs cannot exceed total SRs.'];if(x.reducedConsultants>x.totalConsultants)return['error','Reduced-load consultants cannot exceed total consultants.'];return['ok','Allocation complete']}function rangeText(r){if(!r.people)return'–';return r.plus?`${r.base}–${r.base+1}`:`${r.base}`}function note(r){if(!r.people)return'';return r.plus?`${r.plus} staff receive ${r.base+1}; the rest receive ${r.base}`:'All receive the same'}let current=null;function render(){const x=read(),[type,msg]=validate(x),status=$('status'),personSummary=$('personSummary');if(type==='empty'){status.style.display='none';status.textContent='';personSummary.style.display='none';personSummary.innerHTML='';current=null;return}status.style.display='block';status.className='status '+type;status.textContent=msg;if(type!=='ok'){personSummary.style.display='none';personSummary.innerHTML='';current=null;return}current=calc(x);const activeRows=current.rows.filter(r=>r.people>0);personSummary.innerHTML=activeRows.map(r=>`<div class="person-summary-item"><span>${r.name}</span><strong>${rangeText(r)}</strong></div>`).join('');personSummary.style.display=activeRows.length?'grid':'none'}function summary(){if(!current)return'No completed allocation.';return['OPD Card Allocation',...current.rows.filter(r=>r.people>0).map(r=>`${r.name}: ${rangeText(r)} cards per person`),`Total cards allocated: ${current.total}`].join('\n')}function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}allIds.forEach(id=>$(id).addEventListener('input',render));$('reset').onclick=()=>{leftIds.forEach(id=>$(id).value='');render();$('newCards').focus()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());toast('Summary copied')}catch{toast('Copy not available')}};$('share').onclick=async()=>{const text=summary();if(navigator.share){try{await navigator.share({title:'OPD Card Allocation',text})}catch{}}else{try{await navigator.clipboard.writeText(text);toast('Summary copied for sharing')}catch{toast('Sharing not available')}}};render()})();
</script></body></html>
